<title>Cadê a Banana?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: two mirrored halves on one tablet — top half turned upside down — split by a slim theme bar. Deliberate single bright theme (toy look). */
:root {
  --sky: #CFEAF2;
  --sky-deep: #A9D6E5;
  --peach: #FFE1CF;
  --peach-deep: #F6BE9C;
  --tile: #FFFFFF;
  --ink: #1F3347;
  --ink-soft: #4F6578;
  --tomato: #FF6B3D;
  --sun: #FFC83A;
  --leaf: #2FB57A;
  --leaf-deep: #1F8A5B;
  --berry: #E5484D;
  --font-display: "Baloo 2", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--ink);
  color: var(--ink);
  font-family: var(--font-body);
  margin: 0;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
}
.app { height: 100%; display: flex; flex-direction: column; }

/* Each player's half */
.half {
  --bg: var(--sky); --deep: var(--sky-deep);
  flex: 1; min-height: 0;
  background: var(--bg);
  container-type: size;
  box-sizing: border-box;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.half.top { transform: rotate(180deg); --bg: var(--peach); --deep: var(--peach-deep); }
.inner { height: 100%; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

.bubble {
  background: var(--tile); border-radius: 24px; padding: 6px 10px 6px 16px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 4px 0 var(--deep);
}
.bubble-text { flex: 1; min-width: 0; }
.question { font: 800 clamp(22px, 7cqh, 38px)/1.1 var(--font-display); margin: 0; }
.question b { color: var(--tomato); }
.say { font: 700 clamp(14px, 4cqh, 20px)/1.25 var(--font-body); color: var(--ink-soft); margin: 2px 0 0; min-height: 1.25em; }
.stars {
  flex: none; font: 800 22px var(--font-display); background: var(--bg);
  border-radius: 999px; padding: 2px 12px; font-variant-numeric: tabular-nums;
}

.grid {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
}
@container (max-aspect-ratio: 7/4) {
  .grid { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
}
.tile {
  position: relative;
  border: 0; border-radius: 28px; background: var(--tile); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: min(20cqh, 18cqw, 140px); line-height: 1;
  box-shadow: 0 7px 0 var(--deep);
  transition: transform .15s ease, opacity .4s ease, box-shadow .15s ease, background .2s ease;
  min-height: 0; min-width: 0; padding: 0;
  touch-action: manipulation;
}
.tile:active { transform: translateY(3px); box-shadow: 0 4px 0 var(--deep); }
.tile.gone { opacity: 0; transform: scale(.4); pointer-events: none; }
.tile.wrong { background: var(--berry); box-shadow: 0 7px 0 #A32D31; animation: shake .45s ease; }
.tile.right { background: var(--leaf); box-shadow: 0 7px 0 var(--leaf-deep); animation: hop .7s ease; }
.tile.reveal { outline: 6px dashed var(--leaf); outline-offset: -6px; animation: hop 1s ease 2; }
.half.done .tile:not(.right):not(.reveal):not(.wrong) { opacity: .35; }
.tile:focus-visible, .hint:focus-visible, .chip:focus-visible, .start:focus-visible { outline: 4px solid var(--tomato); outline-offset: 3px; }

.bottom { display: flex; justify-content: center; align-items: center; gap: 14px; }
.hint {
  border: 0; border-radius: 999px; padding: 6px 20px 6px 12px; cursor: pointer;
  background: var(--sun); color: var(--ink); font: 800 20px var(--font-display);
  display: flex; align-items: center; gap: 6px; box-shadow: 0 5px 0 #D9A21C;
  touch-action: manipulation;
}
.hint span { font-size: 28px; }
.hint:disabled { background: var(--deep); box-shadow: none; opacity: .55; cursor: default; }
.waiting { font: 800 18px var(--font-display); color: var(--ink-soft); }

/* Center bar, readable from both sides: emoji only */
.mid {
  flex: none; display: flex; justify-content: center; align-items: center; gap: 10px;
  padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--ink);
}
.chip {
  border: 0; border-radius: 999px; width: 48px; height: 40px; font-size: 24px;
  background: #34506A; cursor: pointer; padding: 0;
}
.chip[aria-pressed="true"] { background: var(--sun); }
.chip.voice { margin-left: 10px; }

.overlay {
  position: fixed; inset: 0; background: var(--sky);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  padding: 24px; text-align: center; z-index: 5;
}
.overlay .big { font-size: 90px; animation: hop 1.6s ease infinite; }
.overlay h1 { font: 800 clamp(40px, 9vw, 64px)/1 var(--font-display); margin: 0; }
.overlay p { font-size: 19px; max-width: 38ch; margin: 0; color: var(--ink-soft); line-height: 1.45; }
.start {
  border: 0; border-radius: 999px; padding: 14px 44px; cursor: pointer;
  background: var(--tomato); color: var(--tile); font: 800 30px var(--font-display);
  box-shadow: 0 7px 0 #C9471F;
}
.confetti { position: fixed; pointer-events: none; font-size: 34px; z-index: 4; animation: fly 1.2s ease-out forwards; }
@keyframes shake { 0%,100% { transform: translateX(0) } 20% { transform: translateX(-12px) } 40% { transform: translateX(12px) } 60% { transform: translateX(-8px) } 80% { transform: translateX(8px) } }
@keyframes hop { 0%,100% { transform: scale(1) } 30% { transform: scale(1.1) rotate(-4deg) } 60% { transform: scale(.97) rotate(3deg) } }
@keyframes fly { from { transform: translate(0,0) scale(.6); opacity: 1 } to { transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(var(--rot)); opacity: 0 } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="app">
  <section class="half top" id="p0" aria-label="Jogador de cima"></section>
  <nav class="mid" id="mid" aria-label="Escolher tema"></nav>
  <section class="half bottom-half" id="p1" aria-label="Jogador de baixo"></section>
</div>

<div class="overlay" id="overlay">
  <div class="big">🍌</div>
  <h1>Cadê a Banana?</h1>
  <p>Deite o iPad na mesa, um de cada lado. Os dois respondem o mesmo desafio e cada um tem duas dicas. Só passa para o próximo quando os dois tiverem respondido.</p>
  <button class="start" id="start">Jogar</button>
</div>

<template id="half-tpl">
  <div class="inner">
    <div class="bubble">
      <div class="bubble-text">
        <p class="question"></p>
        <p class="say"></p>
      </div>
      <div class="stars">⭐ 0</div>
    </div>
    <div class="grid"></div>
    <div class="bottom">
      <button class="hint" data-n="0"><span>💡</span>Dica</button>
      <button class="hint" data-n="1"><span>💡</span>Dica</button>
      <span class="waiting" hidden>Esperando o outro… ⏳</span>
    </div>
  </div>
</template>

<script>
const CATS = {
  frutas: { icon: "🍎", name: "Frutas", items: [
    ["🍌","a","banana",["É amarela e o macaco adora!","É comprida e a gente tira a casca."]],
    ["🍎","a","maçã",["É vermelha e redondinha.","Faz crec crec quando morde!"]],
    ["🍇","a","uva",["São bolinhas roxas juntinhas.","Vem num cacho cheio de bolinhas."]],
    ["🍓","o","morango",["É vermelho com pontinhos.","Tem um chapeuzinho verde em cima."]],
    ["🍉","a","melancia",["É verde por fora e vermelha por dentro.","É grandona e cheia de água!"]],
    ["🍍","o","abacaxi",["Tem uma coroa de folhas!","É amarelo e espinhudo por fora."]],
    ["🍊","a","laranja",["Tem a cor do nome dela!","A gente faz suco com ela."]],
    ["🍐","a","pera",["É verdinha e parece uma gota.","É fininha em cima e gordinha embaixo."]],
    ["🍒","a","cereja",["São duas bolinhas vermelhas.","Ficam penduradas num cabinho."]],
    ["🍋","o","limão",["É azedo! Faz careta!","É amarelinho e a gente faz limonada."]],
  ]},
  animais: { icon: "🐶", name: "Bichos", items: [
    ["🐶","o","cachorro",["Faz au au!","Abana o rabo quando está feliz."]],
    ["🐱","o","gato",["Faz miau!","Gosta de leite e de dormir."]],
    ["🐮","a","vaca",["Faz muuu!","Dá leite pra gente."]],
    ["🐷","o","porco",["Faz oinc oinc!","É rosinha e gosta de lama."]],
    ["🦁","o","leão",["Faz roar! É o rei da floresta.","Tem uma juba bem grande."]],
    ["🐵","o","macaco",["Faz uh uh ah ah!","Adora comer banana."]],
    ["🐔","a","galinha",["Faz có có có!","Bota ovo."]],
    ["🐸","o","sapo",["Faz croac!","É verde e pula muito."]],
    ["🐰","o","coelho",["Tem orelhas compridas.","Pula e come cenoura."]],
    ["🐘","o","elefante",["Tem uma tromba comprida.","É grandão e cinza."]],
    ["🐟","o","peixe",["Mora na água.","Nada, nada, nada!"]],
    ["🦆","o","pato",["Faz quá quá!","Nada no lago."]],
  ]},
  transportes: { icon: "🚗", name: "Transportes", items: [
    ["🚗","o","carro",["Faz bi bi!","Tem quatro rodas e leva a família."]],
    ["🚌","o","ônibus",["É comprido e leva muita gente.","Para no ponto pra gente subir."]],
    ["✈️","o","avião",["Voa lá no céu bem alto.","Tem asas, mas não é passarinho."]],
    ["⛵","o","barco",["Anda na água.","Tem uma vela pro vento empurrar."]],
    ["🚂","o","trem",["Faz piuí piuí!","Anda nos trilhos."]],
    ["🚲","a","bicicleta",["Tem duas rodas e pedal.","A gente pedala pra ela andar."]],
    ["🚁","o","helicóptero",["Voa e tem uma hélice que gira.","Faz tuc tuc tuc lá no céu."]],
    ["🚀","o","foguete",["Vai até a lua!","Sobe bem rápido pro espaço."]],
    ["🚒","o","caminhão de bombeiro",["É vermelho e apaga o fogo.","Faz uóóó uóóó!"]],
    ["🚑","a","ambulância",["Leva quem está dodói pro hospital.","É branca e faz uiu uiu!"]],
    ["🏍️","a","moto",["Tem duas rodas e faz vrum vrum!","Precisa de capacete pra andar."]],
    ["🚜","o","trator",["Trabalha na fazenda.","Tem rodas grandonas atrás."]],
  ]},
  cores: { icon: "🎨", name: "Cores", items: [
    ["🔴","o","vermelho",["É a cor do morango.","É a cor do carro de bombeiro."]],
    ["🔵","o","azul",["É a cor do céu.","É a cor do mar."]],
    ["🟡","o","amarelo",["É a cor do sol.","É a cor da banana."]],
    ["🟢","o","verde",["É a cor da folha.","É a cor do sapo."]],
    ["🟠","o","laranja",["É a cor da cenoura.","É a cor da laranja."]],
    ["🟣","o","roxo",["É a cor da uva.","É a cor da berinjela."]],
    ["🟤","o","marrom",["É a cor do chocolate.","É a cor do tronco da árvore."]],
    ["⚫","o","preto",["É a cor da noite.","É a cor do pneu."]],
    ["⚪","o","branco",["É a cor do leite.","É a cor da nuvem."]],
  ]},
};
const ORDER = ["misturado","frutas","animais","transportes","cores"];
const PRAISE = ["Muito bem!","Isso mesmo!","Parabéns!","Acertou!","Uhuu!"];

let cat = "misturado", round = null, lastAnswer = null, nextTimer = null;
const players = [0, 1].map(i => ({ el: document.getElementById("p" + i), stars: 0 }));

// Voz
let voice = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => v.lang === "pt-BR") || vs.find(v => v.lang && v.lang.replace("_", "-").startsWith("pt")) || null;
  } catch (e) {}
}
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
function speak(text, interrupt) {
  try {
    if (interrupt) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "pt-BR"; u.rate = 0.9; u.pitch = 1.2;
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// Toque rápido e multitoque: os dois podem tocar ao mesmo tempo
function onTap(el, fn) {
  el.addEventListener("pointerdown", e => { e.preventDefault(); fn(); });
  el.addEventListener("click", e => { if (e.detail === 0) fn(); }); // teclado
}

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const cadê = it => `Cadê ${it[1]} ${it[2]}?`;
const esse = it => `${it[1] === "a" ? "Essa é a" : "Esse é o"} ${it[2]}.`;

// Monta as duas metades
for (const [i, p] of players.entries()) {
  p.el.appendChild(document.getElementById("half-tpl").content.cloneNode(true));
  p.q = p.el.querySelector(".question");
  p.say = p.el.querySelector(".say");
  p.starsEl = p.el.querySelector(".stars");
  p.grid = p.el.querySelector(".grid");
  p.hints = [...p.el.querySelectorAll(".hint")];
  p.wait = p.el.querySelector(".waiting");
  p.hints.forEach(h => onTap(h, () => useHint(i)));
}

function renderMid() {
  const mid = document.getElementById("mid");
  mid.innerHTML = "";
  for (const key of ORDER) {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = key === "misturado" ? "🎲" : CATS[key].icon;
    b.setAttribute("aria-label", key === "misturado" ? "Tudo misturado" : CATS[key].name);
    b.setAttribute("aria-pressed", String(key === cat));
    onTap(b, () => { cat = key; renderMid(); newRound(); });
    mid.appendChild(b);
  }
  const v = document.createElement("button");
  v.className = "chip voice";
  v.textContent = "🔊";
  v.setAttribute("aria-label", "Repetir a pergunta");
  onTap(v, () => { if (round) speak(cadê(round.answer), true); });
  mid.appendChild(v);
}

function newRound() {
  clearTimeout(nextTimer);
  const key = cat === "misturado" ? shuffle(Object.keys(CATS))[0] : cat;
  const pool = CATS[key].items.filter(it => it[2] !== lastAnswer);
  const four = shuffle(pool).slice(0, 4);
  const answer = four[Math.random() * 4 | 0];
  lastAnswer = answer[2];
  round = { four, answer };
  players.forEach(p => {
    p.done = false; p.hintsUsed = 0; p.gone = new Set();
    p.el.classList.remove("done");
    p.q.innerHTML = `Cadê ${answer[1]} <b>${answer[2]}</b>?`;
    p.say.textContent = "Toque na figura certa.";
    p.wait.hidden = true;
    p.hints.forEach(h => { h.hidden = false; h.disabled = false; });
    p.grid.innerHTML = "";
    p.tiles = four.map((it, idx) => {
      const b = document.createElement("button");
      b.className = "tile";
      b.textContent = it[0];
      b.setAttribute("aria-label", it[2]);
      onTap(b, () => choose(players.indexOf(p), idx));
      p.grid.appendChild(b);
      return b;
    });
  });
  speak(cadê(answer), true);
}

function choose(pi, idx) {
  const p = players[pi];
  if (!round || p.done || p.gone.has(idx)) return;
  const it = round.four[idx], el = p.tiles[idx];
  p.done = true;
  p.el.classList.add("done");
  p.hints.forEach(h => h.hidden = true);
  if (it === round.answer) {
    el.classList.add("right");
    p.stars++; p.starsEl.textContent = "⭐ " + p.stars;
    const praise = PRAISE[Math.random() * PRAISE.length | 0];
    p.say.textContent = `${praise} ${esse(it)}`;
    speak(praise);
    burst(el);
  } else {
    el.classList.add("wrong");
    p.tiles[round.four.indexOf(round.answer)].classList.add("reveal");
    p.say.textContent = `Ops! ${esse(it)} ${round.answer[1] === "a" ? "A" : "O"} ${round.answer[2]} é esse aqui.`;
    speak(`${esse(it)}`);
  }
  const other = players[1 - pi];
  if (other.done) {
    players.forEach(q => q.wait.hidden = true);
    nextTimer = setTimeout(newRound, 3000);
  } else {
    p.wait.hidden = false;
  }
}

function useHint(pi) {
  const p = players[pi];
  if (!round || p.done || p.hintsUsed >= 2) return;
  const wrong = round.four.map((_, i) => i).filter(i => round.four[i] !== round.answer && !p.gone.has(i));
  const kill = wrong[Math.random() * wrong.length | 0];
  p.gone.add(kill);
  p.tiles[kill].classList.add("gone");
  const phrase = round.answer[3][p.hintsUsed];
  p.hints[p.hintsUsed].disabled = true;
  p.hintsUsed++;
  p.say.textContent = "💡 " + phrase;
  speak(phrase, true);
}

function burst(el) {
  const r = el.getBoundingClientRect();
  const bits = ["⭐","🎉","✨","💛","🌟"];
  for (let k = 0; k < 12; k++) {
    const s = document.createElement("span");
    s.className = "confetti";
    s.textContent = bits[k % bits.length];
    s.style.left = (r.left + r.width / 2 - 17) + "px";
    s.style.top = (r.top + r.height / 2 - 17) + "px";
    const ang = Math.random() * Math.PI * 2, dist = 90 + Math.random() * 140;
    s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
    s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
    s.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1300);
  }
}

renderMid();
document.getElementById("start").addEventListener("click", () => {
  document.getElementById("overlay").hidden = true;
  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
  newRound();
});
</script>
